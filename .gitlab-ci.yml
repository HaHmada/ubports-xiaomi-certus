include:
  - https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/raw/main/gsi-port-ci.yml

image: ubuntu:20.04

build:
  rules:
   - when: never

flashable:
  rules:
   - when: never

devel-flashable:
  rules:
   - when: never
  tags: [ubports]

build:
  extends: build
  rules:
   - if: $CI_PIPELINE_SOURCE == "push"

devel-flashable:
  extends: [devel-flashable]
  needs: [build]
  rules:
   - if: $CI_PIPELINE_SOURCE == "push"
